<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="header">
        <div class="title">
            <h1>Etch-a-Sketch</h1>
        </div>
        <div class="btn-container">
            <button class="random-color-btn">Random = <span class="btn-state">OFF</span></button>
            <button class="resize-grid-btn">Resize grid</button>
            <button class="cell-darkener-btn">Darkener = <span class="btn-state">OFF</span> </button>
        </div>
    </div>
    <div class="content">
        <div class="grid-container"></div>
    </div>
</body>

</html>
